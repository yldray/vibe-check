name: release

# Every push to main publishes a release: zip → VirusTotal → GitHub release
# with the scan links. The version is the latest tag with the patch bumped
# (v1.1.0 → v1.1.1). For a minor or major bump, run this workflow by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check agent files are in sync
        run: sh scripts/sync-agents.sh --check

      - name: Check quick/p0.md is up to date
        run: python3 scripts/build-quick.py --check

      - name: Next version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -eu
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          ver=${last:-v0.0.0}; ver=${ver#v}
          major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          echo "LAST=$last" >> "$GITHUB_ENV"
          echo "VERSION=v$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "Next version: v$major.$minor.$patch (last: ${last:-none})"

      - name: Build zip
        run: git archive --format=zip --prefix=vibe-check/ -o "vibe-check-$VERSION.zip" HEAD

      - name: Upload to VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -eu
          [ -n "$VT_API_KEY" ] || { echo "Missing secret VT_API_KEY"; exit 1; }
          # CLAUDE.md, AGENTS.md and .cursorrules are identical, so one upload covers all three.
          for f in "vibe-check-$VERSION.zip" agents/CLAUDE.md; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -H "x-apikey: $VT_API_KEY" -F "file=@$f" https://www.virustotal.com/api/v3/files)
            case "$code" in
              200) echo "Uploaded $f" ;;
              409) echo "Already on VirusTotal: $f" ;;
              *) echo "VirusTotal upload failed for $f (HTTP $code)"; exit 1 ;;
            esac
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          zip="vibe-check-$VERSION.zip"
          zip_sha=$(sha256sum "$zip" | cut -d' ' -f1)
          agent_sha=$(sha256sum agents/CLAUDE.md | cut -d' ' -f1)
          cat > notes.md <<EOF
          ## VirusTotal

          - Release zip: https://www.virustotal.com/gui/file/$zip_sha
          - Agent file (\`CLAUDE.md\`, \`AGENTS.md\` and \`.cursorrules\` are identical): https://www.virustotal.com/gui/file/$agent_sha

          ## SHA-256

          - \`$zip\`: \`$zip_sha\`
          - Agent file: \`$agent_sha\`

          Check a download yourself: \`shasum -a 256 <file>\`
          EOF
          if [ -n "$LAST" ]; then
            printf '\n## Changes\n\n%s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$LAST" "$VERSION" >> notes.md
          fi
          gh release create "$VERSION" "$zip" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
